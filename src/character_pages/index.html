<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/character.js" type="module"></script>
    <title>Character</title>
</head>
<body>

    <header id="main-header"></header>

    <main>
        <div class="character-page">
            <p>Welcome to the page of...</p>
            <h1 id="name"></h1>

            <h2 class="cute">I really like:</h2>
            <ul>
                <li id="hobby1"></li>
                <li id="hobby2"></li>
                <li id="hobby3"></li>
            </ul>

            <h2 class="cute">My personality traits!</h2>
            <div class="traits">
                <p id="trait1"></p>
                <p id="trait2"></p>
                <p id="trait3"></p>
                <p id="trait4"></p>
                <p id="trait5"></p>
                <p id="trait6"></p>
            </div>

            <p class="cute">One day I'd love to <span id="desire1"></span> and <span id="desire2"></span>... Though <span id=block></span> keeps tripping me up....</p>

            <img class="character-image" src="../public/images/char-placeholder.png" alt="image of the character">

            <div class="basics">
            <h2 class="cute">Basic things about me!</h2> 

            <!-- <p id="name"></p> -->
            <p id="age"></p>
            <p id="mbti"></p>
            <p id="enam"></p>
            </div>
        </div>
        
        <div class="backstory">
            <h2 class="cute">My backstory!</h2>
            <p id="backstory"></p>
        </div>
        
    </main>
    

    <footer id="main-footer"></footer>
</body>
</html>
